name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: backend
        run: bun install --frozen-lockfile
      - working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
        run: |
          bunx prisma generate
          bunx prisma validate
          bun run typecheck
          bun run test
          bun audit --audit-level high

  webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - working-directory: backend
        run: bun install --frozen-lockfile
      - working-directory: webapp
        run: bun install --frozen-lockfile
      - working-directory: webapp
        run: |
          bun run typecheck
          bun run lint
          bun run test
          bun run build
          # The app is a Vite SPA without React Router RSC/framework actions.
          # See SECURITY.md; remove this exception when a patched v7 exists.
          bun audit --audit-level high --ignore GHSA-qwww-vcr4-c8h2

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/hardening-check.sh deploy/.env.compose.example
      - run: docker compose --env-file deploy/.env.compose.example build backend web
