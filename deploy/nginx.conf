map $http_x_forwarded_proto $upstream_forwarded_proto {
  default $scheme;
  http http;
  https https;
}

# The production Nginx Proxy Manager currently reaches this service from
# Docker network 172.19.0.0/16. Only that proxy may supply the client chain.
# Keep host port 8080 firewalled to the proxy host and update this CIDR when
# the proxy network changes.
set_real_ip_from 172.19.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Normal uploads are limited to one 20 MiB object plus multipart framing.
  client_max_body_size 25m;
  client_body_timeout 20s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 60s;

  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https:; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # The vehicle brief extractor intentionally accepts up to four 20 MiB files.
  location = /api/vehicles/extract-brief {
    client_max_body_size 85m;
    client_body_timeout 120s;
    proxy_pass http://backend:3000/api/vehicles/extract-brief;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  location ^~ /api/ {
    proxy_pass http://backend:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location = /health {
    proxy_pass http://backend:3000/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }

  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location ~* \.(?:avif|css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
